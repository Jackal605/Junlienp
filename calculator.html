<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator | Junlie Pillazo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: var(--bg-base);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      font-family: var(--font-body);
    }
    .back-nav-bar {
      width: 100%;
      max-width: 380px;
      margin-bottom: 16px;
      display: flex;
      justify-content: flex-start;
    }
    .btn-back-portfolio {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      text-decoration: none;
    }
    .btn-back-portfolio:hover {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      transform: translateX(-3px);
    }
    .calculator-container {
      max-width: 380px;
      width: 100%;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-card);
      padding: 30px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg), var(--shadow-glow-card);
      color: var(--text-primary);
      position: relative;
    }
    .calculator-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    .calculator-avatar img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--accent-cyan);
      box-shadow: var(--shadow-glow-cyan);
      object-fit: cover;
      aspect-ratio: 1 / 1;
    }
    .calculator-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 10px;
      text-align: center;
      font-family: var(--font-heading);
    }
    .calculator-title span {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .calculator-display {
      width: 100%;
      height: 56px;
      font-size: 1.8rem;
      margin-bottom: 20px;
      text-align: right;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: rgba(9, 13, 22, 0.9);
      color: var(--accent-cyan);
      letter-spacing: 1px;
      outline: none;
      font-family: var(--font-mono);
      font-weight: 600;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .calculator-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .calculator-buttons button {
      padding: 16px 0;
      font-size: 1.15rem;
      font-family: var(--font-heading);
      font-weight: 600;
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-primary);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .calculator-buttons button:hover {
      background: rgba(6, 182, 212, 0.2);
      border-color: var(--accent-cyan);
      color: #fff;
      transform: translateY(-2px);
    }
    .calculator-buttons button:active {
      transform: scale(0.95);
      background: var(--accent-indigo);
    }
    .calculator-buttons .operator-btn {
      color: var(--accent-cyan);
      font-weight: 700;
      background: rgba(6, 182, 212, 0.08);
    }
    .calculator-buttons .clear-btn {
      color: var(--accent-pink);
      font-weight: 700;
      background: rgba(236, 72, 153, 0.1);
    }
    .calculator-buttons .equals-btn {
      grid-column: span 4;
      background: var(--gradient-btn);
      color: #ffffff;
      font-weight: 700;
      font-size: 1.25rem;
      margin-top: 6px;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
      border: none;
    }
    .calculator-buttons .equals-btn:hover {
      background: linear-gradient(135deg, #0e7490 0%, #1d4ed8 100%);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
    }
    .calculator-footer {
      text-align: center;
      margin-top: 20px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="back-nav-bar">
    <a href="index.html" class="btn-back-portfolio">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back to Portfolio</span>
    </a>
  </div>

  <div class="calculator-container">
    <div class="calculator-avatar">
      <img src="avatar.png" alt="Junlie Avatar" aria-label="Avatar" />
      <div class="calculator-title">Junlie's <span>Calculator</span></div>
    </div>
    <input type="text" id="display" class="calculator-display" disabled aria-label="Calculator display" placeholder="0" />
    <div class="calculator-buttons">
      <button onclick="append('7')" aria-label="7">7</button>
      <button onclick="append('8')" aria-label="8">8</button>
      <button onclick="append('9')" aria-label="9">9</button>
      <button onclick="append('/')" class="operator-btn" aria-label="Divide">÷</button>
      
      <button onclick="append('4')" aria-label="4">4</button>
      <button onclick="append('5')" aria-label="5">5</button>
      <button onclick="append('6')" aria-label="6">6</button>
      <button onclick="append('*')" class="operator-btn" aria-label="Multiply">×</button>
      
      <button onclick="append('1')" aria-label="1">1</button>
      <button onclick="append('2')" aria-label="2">2</button>
      <button onclick="append('3')" aria-label="3">3</button>
      <button onclick="append('-')" class="operator-btn" aria-label="Subtract">−</button>
      
      <button onclick="append('0')" aria-label="0">0</button>
      <button onclick="append('.')" aria-label="Decimal">.</button>
      <button onclick="clearDisplay()" class="clear-btn" aria-label="Clear">C</button>
      <button onclick="append('+')" class="operator-btn" aria-label="Add">+</button>
      
      <button onclick="calculate()" class="equals-btn" aria-label="Equals">=</button>
    </div>
    <div class="calculator-footer">&copy; 2026 Junlie Pillazo</div>
  </div>

  <script>
    const display = document.getElementById('display');

    function append(char) {
      if (display.value === 'Error' || (display.value === '0' && char !== '.')) {
        display.value = '';
      }
      display.value += char;
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculate() {
      if (!display.value) return;
      try {
        // Safe evaluation for basic math expression
        let sanitized = display.value.replace(/[^0-9+\-*/.]/g, '');
        let result = Function('"use strict";return (' + sanitized + ')')();
        display.value = Number.isFinite(result) ? result : 'Error';
        if (result === 42) {
          setTimeout(() => alert("✨ You found the answer to life, the universe, and everything!"), 120);
        }
      } catch {
        display.value = 'Error';
      }
    }

    // Keyboard support for calculator
    document.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || ['+', '-', '*', '/', '.'].includes(e.key)) {
        append(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculate();
      } else if (e.key === 'Backspace') {
        display.value = display.value.slice(0, -1);
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
